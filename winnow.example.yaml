sources:
  # The Sweep of github-autobrr fetches the deliveries that winnow missed.
  # hook is the ID of the org webhook.
  github-autobrr:
    secret: "${WINNOW_SECRET_GITHUB_AUTOBRR}"
    sweep: { token: "${WINNOW_GITHUB_TOKEN}", org: autobrr, hook: 123456789 }
  github-s0up4200: { secret: "${WINNOW_SECRET_GITHUB_S0UP4200}" }
  forgejo:         { secret: "${WINNOW_SECRET_FORGEJO}" }

bots:
  - renovate        # Forgejo Renovate account

sinks:
  security: { discord: "${WINNOW_DISCORD_SECURITY}" }
  autobrr:  { discord: "${WINNOW_DISCORD_AUTOBRR}" }
  qui:      { discord: "${WINNOW_DISCORD_QUI}" }
  soup:     { discord: "${WINNOW_DISCORD_SOUP}" }
  releases: { discord: "${WINNOW_DISCORD_RELEASES}" }

routes:
  - name: bot-comments
    drop: true
    match:
      event: [issue_comment, pull_request_review, pull_request_review_comment]
      sender_bot: true
      not:
        - sender: ["renovate[bot]", renovate]
        - { sender: "dependabot[bot]", repo: autobrr/qui }
  - name: security
    to: [security]
    match:
      event: [dependabot_alert, code_scanning_alert, secret_scanning_alert, repository_advisory]
  - name: stars-forks
    drop: true
    match: { event: [watch, fork] }
  # CI, packages, pushes, and administration. "workflow_*" also matches the
  # Forgejo workflow_run_<state> and workflow_job_<state> names.
  - name: noise
    drop: true
    match:
      - event:
          - "workflow_*"
          - "check_*"
          - "deployment*"
          - status
          - page_build
          - action_run_success
          - package
          - registry_package
          - push
          - create
          - delete
          - member
          - membership
          - team
          - organization
          - repository
          - public
          - branch_protection_rule
          - repository_ruleset
          - "installation*"
          - meta
          - deploy_key
          - "project*"
          - milestone
          - label
          - sub_issues
          - issue_dependencies
          - pull_request_review_thread
          # The legacy twin of dependabot_alert.
          - repository_vulnerability_alert
      # Housekeeping on issues, pull requests, comments, and discussions.
      # assigned stays, because it pings the assignee.
      - action:
          - edited
          - deleted
          - labeled
          - unlabeled
          - label_updated
          - label_cleared
          - unassigned
          - milestoned
          - demilestoned
          - locked
          - unlocked
          - pinned
          - unpinned
          - transferred
          - typed
          - untyped
          - synchronize
          - auto_merge_enabled
          - auto_merge_disabled
          - enqueued
          - dequeued
          - converted_to_draft
          - review_request_removed
      # One release sends several Events. Only published goes to Discord.
      - { event: release, not: { action: published } }
  # A missed release that the Sweep finds still goes to Discord. Each other
  # Backfill goes only to the Digests.
  - name: qui-releases
    backfill: true
    to: [releases, qui]
    match: { event: release, action: published, repo: autobrr/qui }
  - name: releases
    backfill: true
    to: [releases]
    match: { event: release, action: published }
  - name: qui
    to: [qui]
    match: { repo: autobrr/qui }
  - name: autobrr
    to: [autobrr]
    match: { owner: autobrr }
  - name: soup
    to: [soup]
    match: { source: [github-s0up4200, forgejo] }

# The Sweep alerts go to the soup channel.
alerts: soup

# One weekly message for autobrr. It also counts the forks that the
# stars-forks Route drops. Winnow keeps the store of the Digests in winnow.db
# next to this file, so this directory must be writable.
digests:
  - name: autobrr-weekly
    every: weekly
    at: "09:00"
    to: autobrr
    match: { owner: autobrr, not: { author_bot: true } }
