# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Keys not set here come from the CodeRabbit dashboard.
# The review rules are in the "Code Review Rules" section of AGENTS.md. CodeRabbit reads AGENTS.md by default.
inheritance: true
early_access: false
tone_instructions: "Be brief. Do not ask for docstrings or comments that restate the code."
reviews:
  allow_author_approval: false # authors cannot run @coderabbitai approve or resolve on their own PRs
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_reviewers: false
  suggested_labels: false
  assess_linked_issues: false
  poem: false
  path_instructions:
    - path: "internal/winnow/migrations/**"
      instructions: "Flag a change to the SQL of a migration file that already exists on the base branch. Winnow records migrations by file name and runs each one only once, so an install that ran it never runs the changed SQL. The change belongs in a new numbered migration. Also flag a rename or a delete of such a file. Winnow has no rename table, so it then stops at start with \"migration X is not in this version of winnow\"."
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  finishing_touches:
    unit_tests:
      enabled: false
  tools:
    languagetool:
      enabled: false
    vale:
      enabled: false
chat:
  art: false
